    <style>
        .dashboard-container {
            text-align: center;
            padding: 50px;

            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

        }

    <!-- Navigation Bar -->

                <li><a href="index.html">Home</a></li>
